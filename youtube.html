<!DOCTYPE html>
<html>
<head>
  <title>YouTube — My April</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #ffd1dc);
      font-family: 'Georgia', 'Gowun Dodum', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 60px;
    }

    a.back {
      align-self: flex-start;
      color: #c2185b;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 24px;
      letter-spacing: 0.04em;
    }
    a.back:hover { text-decoration: underline; }

    h1 {
      font-size: 2.4rem;
      color: #c2185b;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #ad1457;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 3.5rem;
    }

    /* ── Podium ── */
    .podium-wrap {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 12px;
      margin-bottom: 3rem;
    }

    .podium-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    /* info card above block */
    .info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(20px);
      animation: rise 0.5s ease forwards;
    }
    .first  .info { animation-delay: 0.1s; }
    .second .info { animation-delay: 0.25s; }
    .third  .info { animation-delay: 0.4s; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .medal {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .gold   { background: linear-gradient(135deg, #FFD700, #FFA000); }
    .silver { background: linear-gradient(135deg, #C0C0C0, #9E9E9E); }
    .bronze { background: linear-gradient(135deg, #CD7F32, #8D5524); }

    .ch-name {
      font-size: 0.78rem;
      color: #5d0037;
      text-align: center;
      max-width: 120px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .ch-views {
      font-size: 0.7rem;
      color: #ad1457;
      letter-spacing: 0.05em;
    }

    /* podium blocks */
    .block {
      width: 120px;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.2s, transform 0.2s;
    }
    .podium-item:hover .block {
      filter: brightness(1.08);
      transform: translateY(-4px);
    }
    .first  .block { height: 190px; background: linear-gradient(160deg, #FFE082, #FFB300); }
    .second .block { height: 69px;  background: linear-gradient(160deg, #E0E0E0, #9E9E9E); }
    .third  .block { height: 60px;  background: linear-gradient(160deg, #FFCC80, #A1887F); }

    .block-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .block-rank {
      font-size: 1.6rem;
      font-weight: bold;
      color: rgba(255,255,255,0.65);
      line-height: 1;
    }

    .block-count {
      font-size: 0.65rem;
      font-weight: 700;
      color: rgba(255,255,255,0.88);
      letter-spacing: 0.04em;
    }

    .click-hint {
      font-size: 0.78rem;
      color: #ad1457;
      letter-spacing: 0.06em;
      margin-bottom: 0.6rem;
    }

    /* ── Remaining ranks ── */
    .rest-title {
      font-size: 0.75rem;
      color: #ad1457;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      align-self: center;
    }

    .rest-list {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rest-item {
      background: rgba(255,255,255,0.45);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      transform: translateX(0);
      animation: slide 0.4s ease forwards;
    }
    .rest-item:nth-child(1) { animation-delay: 0.55s; }
    .rest-item:nth-child(2) { animation-delay: 0.65s; }
    .rest-item:nth-child(3) { animation-delay: 0.75s; }
    .rest-item:nth-child(4) { animation-delay: 0.85s; }

    @keyframes slide {
      to { opacity: 1; transform: translateX(0); }
    }

    .rest-rank {
      font-size: 1rem;
      font-weight: bold;
      color: #c2185b;
      min-width: 24px;
    }

    .rest-name {
      flex: 1;
      font-size: 0.85rem;
      color: #5d0037;
    }

    .rest-views {
      font-size: 0.75rem;
      color: #ad1457;
    }
  </style>
</head>
<body>

<a href="screentime.html" class="back">← Screentime</a>
<p class="click-hint">click to visit the website!</p>
<h1>YouTube</h1>
<p class="subtitle">Top Channels · April 2026</p>

<div class="podium-wrap">

  <!-- 2nd -->
  <div class="podium-item second" id="p2">
    <div class="info">
      <div class="medal silver">2</div>
      <div class="ch-name" id="name2"></div>
      <div class="ch-views">41 plays</div>
    </div>
    <div class="block"><div class="block-inner"><span class="block-rank">2</span><span class="block-count">41회</span></div></div>
  </div>

  <!-- 1st -->
  <div class="podium-item first" id="p1">
    <div class="info">
      <div class="medal gold">1</div>
      <div class="ch-name" id="name1"></div>
      <div class="ch-views">113 plays</div>
    </div>
    <div class="block"><div class="block-inner"><span class="block-rank">1</span><span class="block-count">113회</span></div></div>
  </div>

  <!-- 3rd -->
  <div class="podium-item third" id="p3">
    <div class="info">
      <div class="medal bronze">3</div>
      <div class="ch-name" id="name3"></div>
      <div class="ch-views">36 plays</div>
    </div>
    <div class="block"><div class="block-inner"><span class="block-rank">3</span><span class="block-count">36회</span></div></div>
  </div>

</div>

<p class="rest-title">그 외 채널</p>
<div class="rest-list" id="restList"></div>

<script>
  const top3 = [
    {
      id: 'p1',
      nameEl: 'name1',
      url: 'https://www.youtube.com/@미녀천명모으기',
      name: '미녀천명모으기'
    },
    {
      id: 'p2',
      nameEl: 'name2',
      url: 'https://www.youtube.com/@nannikas2',
      name: '나니까 NANNIKA'
    },
    {
      id: 'p3',
      nameEl: 'name3',
      url: 'https://www.youtube.com/@' + decodeURIComponent('%EB%82%98%EB%9D%A4%EB%8D%B0%EC%98%88'),
      name: decodeURIComponent('%EB%82%98%EB%9D%A4%EB%8D%B0%EC%98%88')
    }
  ];

  top3.forEach(ch => {
    document.getElementById(ch.nameEl).textContent = ch.name;
    document.getElementById(ch.id).addEventListener('click', () => {
      window.open(ch.url, '_blank');
    });
  });

  const rest = [
    { rank: 4, name: '예능 뭐볼래', views: 34 },
    { rank: 5, name: 'Hearts2Hearts', views: 31 },
    { rank: 6, name: 'eson', views: 27 },
    { rank: 7, name: '패션탐정냥', views: 25 }
  ];

  const list = document.getElementById('restList');
  rest.forEach(ch => {
    const div = document.createElement('div');
    div.className = 'rest-item';
    div.innerHTML = `
      <span class="rest-rank">${ch.rank}</span>
      <span class="rest-name">${ch.name}</span>
      <span class="rest-views">${ch.views} plays</span>
    `;
    list.appendChild(div);
  });
</script>

</body>
</html>
