<!DOCTYPE html>
<html>
<head>
  <title>YouTube — My April</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #ffd1dc);
      font-family: 'Georgia', 'Gowun Dodum', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 60px;
    }

    a.back {
      align-self: flex-start;
      color: #c2185b;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 24px;
      letter-spacing: 0.04em;
    }
    a.back:hover { text-decoration: underline; }

    h1 {
      font-size: 2.4rem;
      color: #c2185b;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #ad1457;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 2.8rem;
    }

    /* ── layout ── */
    .chart-wrap {
      display: flex;
      align-items: center;
      gap: 36px;
      width: 100%;
      max-width: 580px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ── donut ── */
    .donut-container {
      position: relative;
      width: 210px;
      height: 210px;
      flex-shrink: 0;
    }

    .donut-container svg {
      transform: rotate(-90deg);
      filter: drop-shadow(0 6px 18px rgba(194,24,91,0.18));
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: all 0.2s;
    }

    .center-total {
      font-size: 2.3rem;
      font-weight: bold;
      color: #c2185b;
      line-height: 1;
      transition: all 0.2s;
    }

    .center-label {
      font-size: 0.6rem;
      color: #ad1457;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .center-name {
      font-size: 0.72rem;
      color: #5d0037;
      text-align: center;
      max-width: 88px;
      line-height: 1.4;
      margin-top: 7px;
      min-height: 2.1em;
      word-break: keep-all;
    }

    /* ── channel list ── */
    .channel-list {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .ch-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      background: rgba(255,255,255,0.4);
      border-radius: 10px;
      transition: background 0.2s, transform 0.18s, opacity 0.2s;
      opacity: 0;
      transform: translateX(18px);
    }
    .ch-item.visible { opacity: 1; transform: translateX(0); }
    .ch-item.dimmed  { opacity: 0.3; }
    .ch-item.lit     { background: rgba(255,255,255,0.66); transform: translateX(4px); }

    .ch-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ch-info { flex: 1; min-width: 0; }

    .ch-name {
      font-size: 0.82rem;
      color: #5d0037;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ch-link-icon {
      font-size: 0.65rem;
      color: #c2185b;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .ch-bar-bg {
      margin-top: 5px;
      height: 3px;
      background: rgba(194,24,91,0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .ch-bar {
      height: 100%;
      border-radius: 2px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ch-right { text-align: right; flex-shrink: 0; }

    .ch-count {
      font-size: 0.82rem;
      font-weight: bold;
      color: #c2185b;
    }

    .ch-pct { font-size: 0.65rem; color: #ad1457; }

    /* ── segment ── */
    .seg {
      cursor: pointer;
      transition: stroke-width 0.18s ease, opacity 0.18s ease;
    }
    .seg.dimmed { opacity: 0.22; }
    .seg:hover  { stroke-width: 28 !important; }
  </style>
</head>
<body>

<a href="screentime.html" class="back">← Screentime</a>
<h1>YouTube</h1>
<p class="subtitle">Top Channels · April 2026</p>

<div class="chart-wrap">
  <div class="donut-container">
    <svg id="donutSvg" width="210" height="210" viewBox="0 0 210 210"></svg>
    <div class="donut-center">
      <div class="center-total" id="cTotal">307</div>
      <div class="center-label" id="cLabel">total plays</div>
      <div class="center-name"  id="cName"></div>
    </div>
  </div>
  <div class="channel-list" id="channelList"></div>
</div>

<script>
const channels = [
  { name: '미녀천명모으기', views: 113, url: 'https://www.youtube.com/@미녀천명모으기' },
  { name: '나니까 NANNIKA', views: 41,  url: 'https://www.youtube.com/@nannikas2' },
  { name: '나띤데예',       views: 36,  url: 'https://www.youtube.com/@나띤데예' },
  { name: '예능 뭐볼래',   views: 34,  url: null },
  { name: 'Hearts2Hearts', views: 31,  url: null },
  { name: 'eson',          views: 27,  url: null },
  { name: '패션탐정냥',    views: 25,  url: null }
];

const COLORS = ['#880e4f','#c2185b','#e91e63','#f06292','#f48fb1','#ff80ab','#ff4081'];
const total  = channels.reduce((s, c) => s + c.views, 0);

const CX = 105, CY = 105, R = 75, SW = 22;
const CIRC = 2 * Math.PI * R;
const GAP  = 5;

const svg    = document.getElementById('donutSvg');
const listEl = document.getElementById('channelList');
const cTotal = document.getElementById('cTotal');
const cLabel = document.getElementById('cLabel');
const cName  = document.getElementById('cName');

const segEls  = [];
const itemEls = [];
let cumOff = 0;

channels.forEach((ch, i) => {
  const pct     = ch.views / total;
  const sliceLen = pct * CIRC;
  const dashLen  = Math.max(0, sliceLen - GAP);
  const dashOff  = cumOff;
  cumOff += sliceLen;

  // SVG segment
  const seg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  seg.setAttribute('cx', CX);
  seg.setAttribute('cy', CY);
  seg.setAttribute('r',  R);
  seg.setAttribute('fill', 'none');
  seg.setAttribute('stroke', COLORS[i]);
  seg.setAttribute('stroke-width', SW);
  seg.setAttribute('stroke-linecap', 'butt');
  seg.setAttribute('stroke-dashoffset', -dashOff);
  seg.setAttribute('stroke-dasharray', `0 ${CIRC}`);
  seg.classList.add('seg');
  svg.appendChild(seg);
  segEls.push(seg);

  setTimeout(() => {
    seg.style.transition = `stroke-dasharray 0.9s cubic-bezier(0.4,0,0.2,1) ${i * 0.1}s`;
    seg.setAttribute('stroke-dasharray', `${dashLen} ${CIRC - dashLen}`);
  }, 80);

  // List item
  const div = document.createElement('div');
  div.className = 'ch-item';
  div.innerHTML = `
    <div class="ch-dot" style="background:${COLORS[i]}"></div>
    <div class="ch-info">
      <div class="ch-name">${ch.name}${ch.url ? '<span class="ch-link-icon">↗</span>' : ''}</div>
      <div class="ch-bar-bg">
        <div class="ch-bar" style="background:${COLORS[i]};width:${pct * 100}%"></div>
      </div>
    </div>
    <div class="ch-right">
      <div class="ch-count">${ch.views}</div>
      <div class="ch-pct">${(pct * 100).toFixed(0)}%</div>
    </div>
  `;

  if (ch.url) {
    div.style.cursor = 'pointer';
    div.addEventListener('click', () => window.open(ch.url, '_blank'));
  }

  listEl.appendChild(div);
  itemEls.push(div);
  setTimeout(() => div.classList.add('visible'), 120 + i * 75);
});

// Animate bars
setTimeout(() => {
  document.querySelectorAll('.ch-bar').forEach(b => b.style.transform = 'scaleX(1)');
}, 350);

// Hover interactions
function highlight(idx) {
  segEls.forEach((s, j)  => s.classList.toggle('dimmed', j !== idx));
  itemEls.forEach((it, j) => {
    it.classList.toggle('dimmed', j !== idx);
    it.classList.toggle('lit',    j === idx);
  });
  cTotal.textContent = channels[idx].views;
  cLabel.textContent = 'plays';
  cName.textContent  = channels[idx].name;
}

function reset() {
  segEls.forEach(s  => s.classList.remove('dimmed'));
  itemEls.forEach(it => { it.classList.remove('dimmed'); it.classList.remove('lit'); });
  cTotal.textContent = total;
  cLabel.textContent = 'total plays';
  cName.textContent  = '';
}

segEls.forEach((s, i) => {
  s.addEventListener('mouseenter', () => highlight(i));
  s.addEventListener('mouseleave', reset);
});
itemEls.forEach((it, i) => {
  it.addEventListener('mouseenter', () => highlight(i));
  it.addEventListener('mouseleave', reset);
});
</script>

</body>
</html>
