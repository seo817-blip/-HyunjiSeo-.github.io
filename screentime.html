<!DOCTYPE html>
<html>
<head>
  <title>Screentime — My April</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #ffd1dc);
      font-family: 'Georgia', 'Gowun Dodum', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 52px;
    }

    a.back {
      align-self: flex-start;
      color: #c2185b;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 24px;
      letter-spacing: 0.04em;
    }
    a.back:hover { text-decoration: underline; }

    h1 {
      font-size: 2.4rem;
      color: #c2185b;
      letter-spacing: 0.08em;
      margin-bottom: 3.5rem;
    }

    .apps {
      display: flex;
      gap: 4rem;
      justify-content: center;
      align-items: center;
    }

    .app-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      opacity: 0;
      transform: translateY(30px);
      animation: rise 0.55s ease forwards;
    }

    .app-card:nth-child(1) { animation-delay: 0.1s; }
    .app-card:nth-child(2) { animation-delay: 0.3s; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .app-card svg {
      width: 110px;
      height: 110px;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.18));
      transition: transform 0.2s;
      cursor: pointer;
    }
    .app-card svg:hover {
      transform: scale(1.08) translateY(-4px);
    }

    .app-card span {
      font-size: 1rem;
      color: #880e4f;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<a href="index.html" class="back">← My April</a>
<h1>Screentime</h1>

<div class="apps">

  <!-- YouTube -->
  <div class="app-card" onclick="location.href='youtube.html'">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"
         fill="none" stroke="#c2185b" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="14" width="56" height="36" rx="10"/>
      <polygon points="26,22 26,42 44,32" fill="#c2185b" stroke="none"/>
    </svg>
    <span>YouTube</span>
  </div>

  <!-- Instagram -->
  <div class="app-card" onclick="location.href='instagram.html'">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"
         fill="none" stroke="#c2185b" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
      <circle cx="32" cy="32" r="11"/>
      <circle cx="46" cy="18" r="3" fill="#c2185b" stroke="none"/>
    </svg>
    <span>Instagram</span>
  </div>

</div>

</body>
</html>
