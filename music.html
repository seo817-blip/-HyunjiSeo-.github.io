<!DOCTYPE html>
<html>
<head>
  <title>Music — My April</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #ffd1dc);
      font-family: 'Georgia', 'Gowun Dodum', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 60px;
    }

    a.back {
      align-self: flex-start;
      color: #c2185b;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 24px;
      letter-spacing: 0.04em;
    }
    a.back:hover { text-decoration: underline; }

    h1 {
      font-size: 2.4rem;
      color: #c2185b;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.78rem;
      color: #ad1457;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 3rem;
    }

    /* ── Playlist grid ── */
    .playlist-grid {
      display: flex;
      gap: 28px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .playlist-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 148px;
    }

    /* ── Card icon ── */
    .playlist-card {
      width: 148px;
      height: 148px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 6px 24px rgba(194,24,91,0.2);
      transition: transform 0.18s, box-shadow 0.18s;
      user-select: none;
    }

    .playlist-card:hover {
      transform: scale(1.06) translateY(-3px);
      box-shadow: 0 12px 32px rgba(194,24,91,0.28);
    }

    .playlist-card:active {
      transform: scale(0.96);
    }

    .card-1 { background: linear-gradient(140deg, #f48fb1, #c2185b); }
    .card-2 { background: linear-gradient(140deg, #fce4ec, #f06292); }
    .card-3 { background: linear-gradient(140deg, #ff8a80, #e91e63); }

    .card-symbol {
      font-size: 3.6rem;
      color: rgba(255,255,255,0.82);
      pointer-events: none;
      line-height: 1;
    }

    /* ── Card info ── */
    .card-name {
      font-size: 0.74rem;
      color: #5d0037;
      text-align: center;
      line-height: 1.5;
      word-break: keep-all;
    }

    .card-plays {
      font-size: 0.68rem;
      color: #c2185b;
      font-weight: bold;
      letter-spacing: 0.06em;
    }

    .tracklist-btn {
      background: rgba(194,24,91,0.1);
      border: 1px solid rgba(194,24,91,0.28);
      border-radius: 20px;
      color: #c2185b;
      font-family: 'Georgia', 'Gowun Dodum', serif;
      font-size: 0.64rem;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .tracklist-btn:hover { background: rgba(194,24,91,0.2); }

    /* ── Floating notes ── */
    .float-note {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 1.2rem;
      color: #c2185b;
      transform: translate(-50%, -50%);
      transition: transform 0.75s cubic-bezier(0.2,0.8,0.4,1), opacity 0.75s ease-out;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(93,0,37,0.35);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: linear-gradient(160deg, #fff5f8, #fce4ec);
      border-radius: 20px;
      padding: 28px 24px 24px;
      width: 320px;
      max-height: 80vh;
      box-shadow: 0 12px 48px rgba(93,0,37,0.28);
      border: 1.5px solid rgba(255,255,255,0.8);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 1rem;
      color: #880e4f;
      font-weight: bold;
      line-height: 1.4;
    }

    .modal-close {
      background: none;
      border: none;
      color: #ad1457;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0 0 8px;
      flex-shrink: 0;
    }
    .modal-close:hover { color: #c2185b; }

    .track-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .track-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 4px;
      border-bottom: 1px solid rgba(194,24,91,0.08);
    }
    .track-item:last-child { border-bottom: none; }

    .track-num   { font-size: 0.65rem; color: #e91e63; width: 16px; flex-shrink: 0; text-align: right; opacity: 0.7; }
    .track-title { font-size: 0.78rem; color: #5d0037; font-weight: bold; }
    .track-artist { font-size: 0.72rem; color: #ad1457; flex-shrink: 0; }
  </style>
</head>
<body>

<a href="index.html" class="back">← My April</a>
<h1>Music</h1>
<p class="subtitle">Most Played · April 2026</p>

<div class="playlist-grid">

  <!-- 1 -->
  <div class="playlist-item">
    <div class="playlist-card card-1" id="card1">
      <span class="card-symbol">♪</span>
    </div>
    <div class="card-name">과제 할 때 집중 하기 좋은<br>로파이 재즈 힙합</div>
    <div class="card-plays">8 plays</div>
    <button class="tracklist-btn" onclick="openModal(1)">♩ 트랙목록</button>
  </div>

  <!-- 2 -->
  <div class="playlist-item">
    <div class="playlist-card card-2" id="card2">
      <span class="card-symbol">♫</span>
    </div>
    <div class="card-name">playlist 진짜 미친건가</div>
    <div class="card-plays">6 plays</div>
    <button class="tracklist-btn" onclick="openModal(2)">♩ 트랙목록</button>
  </div>

  <!-- 3 -->
  <div class="playlist-item">
    <div class="playlist-card card-3" id="card3">
      <span class="card-symbol">♬</span>
    </div>
    <div class="card-name">playlist | 고능 케이팝 플리<br>보고드립니다.</div>
    <div class="card-plays">6 plays</div>
    <button class="tracklist-btn" onclick="openModal(3)">♩ 트랙목록</button>
  </div>

</div>

<!-- Modals -->
<div class="modal-overlay" id="modal1" onclick="closeModalOutside(event,1)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">과제 할 때 집중 하기 좋은<br>로파이 재즈 힙합</div>
      <button class="modal-close" onclick="closeModal(1)">✕</button>
    </div>
    <div class="track-list" id="list1"></div>
  </div>
</div>

<div class="modal-overlay" id="modal2" onclick="closeModalOutside(event,2)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">playlist 진짜 미친건가</div>
      <button class="modal-close" onclick="closeModal(2)">✕</button>
    </div>
    <div class="track-list" id="list2"></div>
  </div>
</div>

<div class="modal-overlay" id="modal3" onclick="closeModalOutside(event,3)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">playlist | 고능 케이팝 플리<br>보고드립니다.</div>
      <button class="modal-close" onclick="closeModal(3)">✕</button>
    </div>
    <div class="track-list" id="list3"></div>
  </div>
</div>

<script>
  /* ── Tracklists ── */
  const trackData = {
    1: [
      { artist: 'nawhij',         title: 'So glad' },
      { artist: 'Joey Pecoraro',  title: 'Partly sunny' },
      { artist: 'Jazzinuf',       title: 'Be mine' },
      { artist: 'misim',          title: 'Autumn in Paris' },
      { artist: 'hentaidesu',     title: 'before sunset' },
      { artist: 'chuckee.',       title: 'sweet tarts' },
      { artist: 'seph',           title: 'body and soul' },
      { artist: 'Chance Thrash',  title: 'Vague' },
      { artist: 'nawhij',         title: 'iwantmoretimewithyou' },
      { artist: 'burbank',        title: 'seeing your name makes me happy' },
      { artist: 'Joey Pecoraro',  title: 'Finding parking' },
      { artist: 'Tanoki',         title: 'holiday/w johnny' },
      { artist: 'hentaidesu',     title: 'sharing an umbrella' },
      { artist: 'sophie meiers',  title: 'sincerely, yours' },
      { artist: 'Sunny Shin',     title: 'your sunday' },
    ],
    2: [
      { artist: '주혜린',          title: '미친건가' },
      { artist: '백예린',          title: 'MIRROR' },
      { artist: 'Tauren Wells',    title: 'Miracle' },
      { artist: '차울',            title: '908' },
      { artist: 'Mayer Hawthorne', title: 'Time For Love' },
      { artist: 'NewJeans',        title: 'Attention (250 Remix)' },
      { artist: 'RAKUNELAMA',      title: 'GOSU' },
      { artist: '주혜린',          title: '미장원 (Re-Make)' },
      { artist: 'shinjihang',      title: '전단지' },
      { artist: 'Cody Fry',        title: 'Thinking About You' },
      { artist: '크러쉬',          title: 'A Man Like Me' },
      { artist: '주혜린',          title: 'busy boy' },
      { artist: 'WhiteUsedSocks',  title: 'HOW i WiSH!' },
      { artist: 'Blish',           title: 'High roller (feat. SUMIN)' },
      { artist: '주혜린',          title: '미친건가 (Re-Make)' },
      { artist: '이찬혁',          title: '멸종위기사랑' },
    ],
    3: [
      { artist: 'Hearts2Hearts', title: 'FOCUS' },
      { artist: 'RIIZE',         title: 'Talk Saxy' },
      { artist: 'KiiiKiii',      title: '404 (New Era)' },
      { artist: 'EXO',           title: 'Cream Soda' },
      { artist: 'LE SSERAFIM',   title: 'FEARLESS' },
      { artist: 'ENHYPEN',       title: 'XO (Only If You Say Yes)' },
      { artist: 'NCT 127',       title: 'Favorite (Vampire)' },
      { artist: 'f(x)',          title: '4 Walls' },
    ],
  };

  [1, 2, 3].forEach(n => {
    const el = document.getElementById('list' + n);
    trackData[n].forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'track-item';
      row.innerHTML = `<span class="track-num">${i+1}</span><span class="track-title">${t.title}</span><span class="track-artist">— ${t.artist}</span>`;
      el.appendChild(row);
    });
  });

  function openModal(n) {
    document.getElementById('modal' + n).classList.add('open');
  }
  function closeModal(n) {
    document.getElementById('modal' + n).classList.remove('open');
  }
  function closeModalOutside(e, n) {
    if (e.target === document.getElementById('modal' + n)) closeModal(n);
  }

  /* ── Continuous notes ── */
  const NOTE_CHARS = ['♪', '♫', '♩', '♬'];

  function spawnNote(cardEl) {
    const rect = cardEl.getBoundingClientRect();
    const note = document.createElement('span');
    note.className = 'float-note';
    note.textContent = NOTE_CHARS[Math.floor(Math.random() * NOTE_CHARS.length)];

    const x = rect.left + 16 + Math.random() * (rect.width  - 32);
    const y = rect.top  + 16 + Math.random() * (rect.height - 32);
    note.style.left     = x + 'px';
    note.style.top      = y + 'px';
    note.style.fontSize = (0.85 + Math.random() * 0.55) + 'rem';
    document.body.appendChild(note);

    const dx = (Math.random() - 0.5) * 56;
    const dy = -(48 + Math.random() * 52);

    requestAnimationFrame(() => requestAnimationFrame(() => {
      note.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      note.style.opacity   = '0';
    }));

    setTimeout(() => note.remove(), 900);
  }

  function startNotes(cardEl, intervalMs) {
    setInterval(() => spawnNote(cardEl), intervalMs);
  }

  // 8 plays → 220ms 간격 (빠름), 6 plays → 550ms 간격 (느림)
  startNotes(document.getElementById('card1'), 120);
  startNotes(document.getElementById('card2'), 550);
  startNotes(document.getElementById('card3'), 550);
</script>

</body>
</html>
